name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution first. FoodList aims to stay simple — the smaller the idea, the more likely it lands.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
