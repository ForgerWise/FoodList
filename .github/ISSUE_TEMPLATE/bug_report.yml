name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tap Add
        2. Scan barcode 4902220770199
        3. ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Feedback shows the version.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [English, 繁體中文, 日本語]
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
