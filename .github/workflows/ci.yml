name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Translations are regenerated
        run: |
          dart run intl_utils:generate
          dart format lib/generated > /dev/null
          git diff --exit-code -- lib/generated || (echo "::error::Run 'dart run intl_utils:generate' then 'dart format lib test' and commit lib/generated" && exit 1)

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
